<style>
/* Chat Widget Styles */
.chat-widget {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 300px;
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 2px 15px rgba(0,0,0,0.1);
  z-index: 1000;
  overflow: hidden;
}

.chat-header {
  background: #2c3e50;
  color: white;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
}

.chat-title {
  font-weight: bold;
}

.chat-toggle {
  background: none;
  border: none;
  color: white;
  cursor: pointer;
}

.chat-body {
  height: 400px;
  display: flex;
  flex-direction: column;
}

.chat-messages {
  flex-grow: 1;
  padding: 15px;
  overflow-y: auto;
}

.message {
  margin-bottom: 10px;
  display: flex;
}

.message.sent {
  justify-content: flex-end;
}

.message-content {
  max-width: 80%;
  padding: 10px 15px;
  border-radius: 15px;
  background: #f0f2f5;
}

.message.sent .message-content {
  background: #0084ff;
  color: white;
}

.chat-input {
  display: flex;
  padding: 15px;
  border-top: 1px solid #eee;
}

.chat-input input {
  flex-grow: 1;
  padding: 8px 12px;
  border: 1px solid #ddd;
  border-radius: 20px;
  margin-right: 10px;
}

.chat-input button {
  background: #0084ff;
  color: white;
  border: none;
  padding: 8px 15px;
  border-radius: 20px;
  cursor: pointer;
}

.chat-input button:hover {
  background: #0073e6;
}

/* Initially hide chat body */
.chat-body {
  display: none;
}

.chat-widget.open .chat-body {
  display: flex;
}

.chat-widget.open .toggle-icon {
  transform: rotate(180deg);
}
</style>
