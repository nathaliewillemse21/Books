    <main>    <h1>Checkout</h1>


<div class="container mt-5">
    <h1>Book Store</h1>

    <!-- Search and Sort Filters -->
    <div class="row mb-4">
        <div class="col-md-6">
            <input type="text" id="searchInput" class="form-control" placeholder="Search books...">
        </div>
        <div class="col-md-6">
            <select id="sortSelect" class="form-select">
                <option value="title">Sort by Title</option>
                <option value="price-asc">Sort by Price (Low to High)</option>
                <option value="price-desc">Sort by Price (High to Low)</option>
            </select>
        </div>
    </div>

    <!-- Product Grid (Books) -->
    <div id="productGrid" class="row"></div>

    <!-- Cart Button and Cart Modal -->
    <button id="viewCartBtn" class="btn btn-primary mt-4" data-bs-toggle="modal" data-bs-target="#cartModal">
        View Cart <span id="cartCount">0</span> items
    </button>

</div>

<!-- Modal for Cart Details -->
<div class="modal fade" id="cartModal" tabindex="-1" aria-labelledby="cartModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="cartModalLabel">Shopping Cart</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body cart-body">
                <!-- Cart content will be dynamically inserted here -->
            </div>
        </div>
    </div>
</div>



</main>

    <script src="../script/checkout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
